  "Fixation Duration [ms]": "fixation-dur"
  "Average Pupil Size X": "pupil-size-avg-x"
  "Average Pupil Size Y": "pupil-size-avg-y"
  "Dispersion X": "dispersion-x"
  "Dispersion Y": "dispersion-y"
  "Saccade Duration [ms]": "saccade-dur"
  "Amplitude [°]": "saccade-amp"
  "Blink Count": "blink-count"
  "Blink Frequency [count/s]": "blink-rate"
  "Blink Duration Total [ms]": "blink-dur-total"  
  "Blink Duration Average [ms]": "blink-dur-avg"
  "Blink Duration Maximum [ms]": "blink-dur-max"
  "Blink Duration Minimum [ms]": "blink-dur-min"
  "Fixation  Count": "fixation-count"
  "Fixation  Frequency [count/s]": "fixation-frequency"
  "Fixation  Duration Total [ms]": "fixation-duration-total"
  "Fixation  Duration Average [ms]": "fixation-duration-avg"
  "Fixation  Duration Maximum [ms]": "fixation-duration-max"
  "Fixation  Duration Minimum [ms]": "fixation-duration-min"
  "Fixation  Dispersion Total [px]": "fixation-dispersion-total"
  "Fixation  Dispersion Average [px]": "fixation-dispersion-avg"
  "Fixation  Dispersion Maximum [px]": "fixation-dispersion-max"
  "Fixation  Dispersion Minimum [px]": "fixation-dispersion-min"
  "Scanpath Length [px]": "scanpath-length"
  "Saccade  Count": "saccade-count"
  "Saccade  Frequency [count/s]": "saccade-frequency"
  "Saccade  Duration Total [ms]": "saccade-duration-total"
  "Saccade  Duration Average [ms]": "saccade-duration-avg"
  "Saccade  Duration Maximum [ms]": "saccade-duration-max"
  "Saccade  Duration Minimum [ms]": "saccade-duration-min"
  "Saccade  Amplitude Total [°]": "saccade-amplitude-total"
  "Saccade  Amplitude Average [°]": "saccade-amplitude-avg"
  "Saccade  Amplitude Maximum [°]": "saccade-amplitude-max"
  "Saccade  Amplitude Minimum [°]": "saccade-amplitude-min"
  "Saccade  Latency Average [ms]": "saccade-latency-avg"
