# Mapping from Tobii TSV columns to GFM schema fields.
mappings:
  "Timestamp": ""                          
  "MicroSecondTimestamp": "time-rel-seconds"              # relative timestamp (µs)
  "AbsoluteMicroSecondTimestamp": "time-abs-seconds"      # absolute timestamp in µs
  "DateTimeStamp": ""                          # drop or parse separately
  "DateTimeStampStartOffset": ""               # drop
  "Number": ""                                 # drop (row number)

  # Gaze coordinates
  "GazePointXLeft": "x-left"
  "GazePointYLeft": "y-left"
  "GazePointXRight": "x-right"
  "GazePointYRight": "y-right"
  "GazePointX": "x-avg"
  "GazePointY": "y-avg"
  "MappedGazeDataPointX": ""                   # drop or custom mapping
  "MappedGazeDataPointY": ""
  "CamXLeft": ""                               # drop camera coords
  "CamYLeft": ""
  "CamXRight": ""
  "CamYRight": ""

  # Distance
  "DistanceLeft": "distance-left"
  "DistanceRight": "distance-right"

  # Pupil data
  "PupilLeft": "pupil-size-left-avg"
  "PupilRight": "pupil-size-right-avg"

  # Validity / confidence
  "ValidityLeft": "raw-validity-gaze-left"
  "ValidityRight": "raw-validity-gaze-right"

  # Fixation data
  "FixationIndex": "fixation-index"
  "MappedFixationPointX": ""
  "MappedFixationPointY": ""
  "FixationDuration": "fixation-duration"

  # AOI / Event / Stimulus
  "Event": "event-type"
  "EventKey": ""
  "Data1": ""
  "Data2": ""
  "Descriptor": ""
  "StimuliName": "event"
  "StimuliID": "stimulus-id"

  # Media properties (drop)
  "MediaWidth": ""
  "MediaHeight": ""
  "MediaPosX": ""
  "MediaPosY": ""

  # AOI metadata (drop)
  "AoiIds": ""
  "AoiNames": ""
  "WebGroupImage": ""

  # Additional identifiers
  "AudioSampleNumber": ""                      # drop if unused
