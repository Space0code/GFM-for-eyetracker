[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfm-for-eyetracker"
version = "0.1.0"
description = "Eye-tracking ML research codebase for GNN and baseline experiments"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["emotions*", "data*", "gnext*"]
namespaces = true
