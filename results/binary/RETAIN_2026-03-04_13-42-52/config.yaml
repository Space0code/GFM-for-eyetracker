baselines:
  hyperparameters:
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
    MLP:
      early_stopping: false
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
    Mean: {}
    SVM:
      n_jobs: -1
      probability: true
  models:
  - Mean
  - SVM
  - LightGBM
  - MLP
binary_task:
  decision_threshold: 0.5
  target_column: emotion-valence
  threshold: mean
cross_validation:
  random_state: 42
  strategies:
  - recording_loo
  val_size: 1
dataset:
  allowed_experiment_types:
  - emotion-elicitation
  allowed_label_quality_values:
  - ok
  cache_dir: data/cache
  data_filepath: data/processed/cached_hci_tagging_emotion.csv
  dropna_columns:
  - time-rel-seconds
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  - emotion-valence
  - subject
  - recording
  dropping_emotion_threshold: -1
  experiment_type_column: experiment-type
  feature_columns:
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  filter_subjects:
  - P1
  - P8
  - P5
  - P4
  - P28
  - P2
  - P27
  ignore_dirs: []
  ks: 2
  kt: 2
  label_quality_column: emotion-derivation-status
  min_samples_per_window: 3
  recursive: true
  standardize_features: true
  target_aggregation: mean
  tau: 0.05
  use_cache: false
  use_edge_weights: false
  window_length: 10
  window_overlap: 0
gnn:
  model:
    add_self_loops: true
    aggr: mean
    conv_type: GCNConv
    dropout_gnn: 0.1
    dropout_head: 0.1
    dropout_mlp: 0.1
    hidden_channels: 128
    in_channels: 4
    use_preprocess_mlp: true
  training:
    batch_size: 64
    device: auto
    grad_clip_max_norm: 1.0
    learning_rate: 0.001
    num_epochs: 35
    num_workers: 8
    persistent_workers: true
    pin_memory: true
    random_seed: 42
    use_torch_compile: true
logging:
  results_dir: results/binary
  save_outputs_interval: 10
  verbose: false
metrics:
- accuracy
- precision
- recall
- f1
- auc
run_experiments:
  baselines: true
  gnn: true
