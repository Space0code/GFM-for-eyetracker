run_experiments:
  baselines: true
  gnn: true
multiclass_task:
  task_name: table6-valence-3class
  target_column: emotion-id
  class_name_mapping:
    0: Unpleasant
    1: Neutral valence
    2: Pleasant
  table6_class_mapping:
    0: 1
    1: 0
    2: 0
    3: 0
    4: 2
    5: 0
    6: 1
    11: 2
    12: 0
  drop_unmapped_labels: true
  use_table6_3class_targets: true
dataset:
  data_filepath: results/suite/2026-04-02_17-56-07/experiments/multiclass_table6_valence_3class_emotion-elicitation/snapshot.csv
  label_mapping_spec_path: specifications/hci_to_GFM_spec.yaml
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  min_samples_per_window: 3
  kt: 2
  ks: 2
  use_edge_weights: true
  tau: 0.05
  cache_dir: data/cache
  use_cache: true
  dropping_emotion_threshold: -1
  standardize_features: true
  target_aggregation: mean
  feature_columns:
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  dropna_columns:
  - time-rel-seconds
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  - emotion-id
  - subject
  - recording
  experiment_type_column: experiment-type
  allowed_experiment_types:
  - emotion-elicitation
  label_quality_column: emotion-derivation-status
  allowed_label_quality_values:
  - ok
  signal_outlier_filter:
    enabled: true
    lower_quantile: 0.01
    upper_quantile: 0.99
    columns:
    - x-avg
    - y-avg
    - pupil-size-left-avg
    - pupil-size-right-avg
  filter_subjects: null
  filter_recordings: null
cross_validation:
  strategies:
  - subject_kfold
  n_splits: 5
  val_size: 1
  random_state: 42
baselines:
  models:
  - Mean
  - SVM
  - LightGBM
  - MLP
  hyperparameters:
    Mean: {}
    SVM:
      probability: true
      random_state: 42
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
      random_state: 42
    MLP:
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
      early_stopping: false
gnn:
  model:
    in_channels: 4
    hidden_channels: 128
    use_preprocess_mlp: true
    add_self_loops: true
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv
    pooling: mean_max
    num_layers: 10
  training:
    num_epochs: 35
    batch_size: 64
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto
    random_seed: 42
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    use_torch_compile: true
    early_stopping_enabled: true
    early_stopping_patience: 7
    early_stopping_min_delta: 0.0
    early_stopping_restore_best: true
metrics:
- accuracy
- balanced_accuracy
- macro_precision
- macro_recall
- macro_f1
- macro_auc_ovr
- weighted_precision
- weighted_recall
- weighted_f1
- weighted_auc_ovr
logging:
  results_dir: results/suite/2026-04-02_17-56-07
  verbose: false
  run_name_prefix: multiclass_table6_valence_3class_emotion-elicitation
