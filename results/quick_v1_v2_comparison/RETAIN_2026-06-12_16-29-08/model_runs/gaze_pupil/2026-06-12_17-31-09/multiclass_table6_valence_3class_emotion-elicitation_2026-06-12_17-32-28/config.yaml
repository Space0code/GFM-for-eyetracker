run_experiments:
  baselines: true
  gnn: true
benchmarking:
  enabled: true
  warmup_runs: 1
  timed_runs: 3
  synthetic_windows_per_run: 16
multiclass_task:
  task_name: table6-valence-3class
  target_column: emotion-id
  use_table6_3class_targets: true
  drop_unmapped_labels: true
  class_name_mapping:
    0: Low valence
    2: High valence
  table6_class_mapping:
    1: 0
    2: 0
    3: 0
    4: 2
    5: 0
    11: 2
    12: 0
dataset:
  data_filepath: results/quick_v1_v2_comparison/2026-06-12_16-29-08/model_runs/gaze_pupil/2026-06-12_17-31-09/experiments/multiclass_table6_valence_3class_emotion-elicitation/snapshot.csv
  label_mapping_spec_path: specifications/hci_to_GFM_spec.yaml
  exclude_subjects:
  - P9
  - P12
  - P15
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  min_samples_per_window: 60
  kt: 1
  ks: 1
  use_edge_weights: true
  graph_version: v2
  edge_weight_mode: learned_signed
  use_relative_time: true
  use_distance_avg: false
  use_fixation_duration: false
  use_delta_distance_edge_feature: false
  use_fixation_edges: false
  fixation_dilation_k: 3
  tau: 0.05
  cache_dir: data/cache
  use_cache: true
  dropping_emotion_threshold: -1
  standardize_features: true
  standardize_edge_features: true
  target_aggregation: mean
  feature_columns:
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  dropna_columns:
  - time-rel-seconds
  - subject
  - recording
  - x-avg
  - y-avg
  - pupil-size-left-avg
  - pupil-size-right-avg
  - emotion-id
  experiment_type_column: experiment-type
  allowed_experiment_types:
  - emotion-elicitation
  label_quality_column: emotion-derivation-status
  allowed_label_quality_values:
  - ok
  signal_outlier_filter:
    enabled: true
    lower_quantile: 0.01
    upper_quantile: 0.99
    columns:
    - x-avg
    - y-avg
    - pupil-size-left-avg
    - pupil-size-right-avg
  use_temporal_node_feature: true
  use_temporal_edge_features: true
  use_temporal_edges: true
  use_spatial_edges: true
  use_gaze_node_features: true
  use_gaze_edge_features: true
  use_pupil_node_features: true
  use_pupil_edge_features: true
  use_screen_distance_node_feature: false
  use_screen_distance_edge_feature: false
  use_fixation_node_feature: false
  snapshot_manifest_path: results/quick_v1_v2_comparison/2026-06-12_16-29-08/model_runs/gaze_pupil/2026-06-12_17-31-09/experiments/multiclass_table6_valence_3class_emotion-elicitation/snapshot_manifest.yaml
  snapshot_hash: f39d2621baafb4ef954b69b0eccc21b783b489ea4f5e5fceec28b4702d5e8f5a
  snapshot_cache_key: 8beacaf061f59f1004caf841367cad1aec763af132f86cb2690fdf30486d31c7
  filter_subjects: null
  filter_recordings: null
