      learning_rate: 0.001
      weight_decay: 0.0001
      dropout: 0.2
      early_stopping_patience: 15
      batch_size: 128
      random_state: 42
      device: auto
gazemae:
  model_pos: models/gazemae/pos-i3738-encoder-state.pt
  model_vel: models/gazemae/vel-i8528-encoder-state.pt
  screen_width: 1280
  screen_height: 800
  clip_to_screen: true
  target_hz: 500
  chunk_seconds: 2.0
  chunk_pooling: mean_std
  batch_size: 256
  device: auto
  cache_embeddings: true
moment:
  model_name: AutonLab/MOMENT-1-base
  sequence_length: 512
  batch_size: 64
  device: auto
  cache_embeddings: true
  cache_dir: data/cache/moment_embeddings
  local_files_only: false
gnn:
  model:
    model_version: BasicGCN
    in_channels: 5
    hidden_channels: 64
    num_layers: 2
    head_pooling: attention
    graph_pooling: attention
    use_preprocess_mlp: true
    add_self_loops: true
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv
    use_spatial_edges: true
    use_fixation_edges: false
    use_delta_distance_edge_feature: false
    spatial_edge_attr_dim: 8
    temporal_edge_attr_dim: 9
    fixation_edge_attr_dim: 8
  training:
    num_epochs: 350
    batch_size: 256
    learning_rate: 5.0e-05
    grad_clip_max_norm: 1.0
    device: auto
    random_seed: 42
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    use_torch_compile: false
    early_stopping_enabled: true
    early_stopping_patience: 20
    early_stopping_min_delta: 0.0
    early_stopping_restore_best: true
  models:
  - BasicGCN
  - HeteroGCNMean
  - HeteroGCNMLP
  - HeteroGCNMLPWeights
metrics:
- accuracy
- balanced_accuracy
- macro_precision
- macro_recall
- macro_f1
- macro_auc_ovr
- weighted_precision
- weighted_recall
- weighted_f1
- weighted_auc_ovr
logging:
  results_dir: results/quick_v1_v2_comparison/2026-06-12_16-29-08/model_runs/gaze_pupil/2026-06-12_17-31-09
  verbose: false
  run_name_prefix: multiclass_table6_valence_3class_emotion-elicitation
