# Unified configuration for GNN and Baseline experiments
# Specifies which experiments to run and their parameters

# Control which experiments to run
run_experiments:
  baselines: true  # Run baseline models
  gnn: true        # Run GNN model

# Dataset configuration (shared by both GNN and baselines)
dataset:
  data_dir: "data/processed/eSEEd_v2_processed"
  file_list: null  # null = use all files
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  kt: 5  # Temporal k-NN for GNN
  ks: 5  # Spatial k-NN for GNN
  cache_dir: "data/cache"
  use_cache: true
  dropping_emotion_threshold: -1  # Drop samples where all emotions <= this value

# Cross-validation configuration (shared)
cross_validation:
  strategies: 
    # - subject_loo
    - recording_loo
    # - combined_loo
  val_size: 1  # Number of subjects/recordings/pairs for validation
  random_state: 42

# Baseline models configuration
baselines:
  # List of baseline models to train (options: Mean, SVM, LightGBM)
  models:
    - Mean
    - SVM
    - LightGBM
  
  # Hyperparameters for each model (optional, uses defaults if not specified)
  hyperparameters:
    Mean: {}
    SVM:
      n_jobs: -1
    LightGBM:
      n_jobs: -1
      verbose: -1

# GNN model configuration
gnn:
  model:
    in_channels: 5  # 5 node features: time, x, y, pupil-left, pupil-right
    hidden_channels: 64
    out_channels: 4
    output_scale: 10.0
    use_preprocess_mlp: true
    add_self_loops: false
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv
  
  training:
    num_epochs: 100
    batch_size: 32
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto  # 'auto', 'cuda', or 'cpu'
    random_seed: 42

# Metrics to compute (shared)
metrics:
  - mse
  - mae
  - r2
  - spearman

# Logging configuration (shared)
logging:
  results_dir: "results/combined"
  save_outputs_interval: 10  # Save outputs every N epochs for GNN
