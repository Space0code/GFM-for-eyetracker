# Configuration file for emotion prediction training

# Dataset configuration
dataset:
  data_dir: "./data/processed/eSEEd_v2/" # Path to processed data directory
  file_list: null  # File selection (null means load all files recursively) 
    
  recursive: true # Whether to search recursively in subdirectories
  ignore_dirs: null # Directories to ignore during recursive search
  
  # Graph construction parameters
  window_length: 8  # Window length in seconds
  window_overlap: 0.0  # Overlap fraction [0, 1)
  kt: 2  # Number of temporal neighbors
  ks: 2  # Number of spatial neighbors (kNN)
  
  # Caching configuration
  cache_dir: "./data/cache/"
  use_cache: true

# Model architecture configuration
model:
  in_channels: 5 # Input features: time, x, y, pupil-left, pupil-right
  hidden_channels: 64
  out_channels: 4
  output_scale: 10.0 # Output scaling factor for emotion scores
  use_preprocess_mlp: true
  add_self_loops: false
  dropout_mlp: 0.1
  dropout_gnn: 0.1
  dropout_head: 0.1
  aggr: "mean"  # Aggregation method for GNN layers: "mean", "sum", "max"
  conv_type: "GATConv"  # Convolutional layer type: "GCNConv" or "GATConv"

# Training configuration
training:
  num_epochs: 10
  batch_size: 4
  learning_rate: 0.0001
  grad_clip_max_norm: 1.0
  device: "auto"  # auto = cuda if available, else cpu
  random_seed: 42

# Cross-validation configuration
cross_validation:
  # Strategies: List of strategies to run. Options: "subject_loo", "recording_loo", "combined_loo"
  # Can be a single string or a list of strings
  strategies:
    # - "subject_loo"
    - "recording_loo"
    # - "combined_loo"
  
  val_size: 2 # Number of subjects/recordings for validation set
  random_state: 42 # Random state for reproducible splits
  test_size: 0.2 # Test split ratio (only used for simple_split strategy)

# Logging and checkpointing configuration
logging:
  results_dir: "./results/SpatioTemporalHeteroGNN/eSEEd_v2/" # Base directory for results
  print_every: 10 # Print training progress every N epochs
  save_outputs_interval: null  # Save validation outputs every N epochs (null = no saving)
  save_best_model: true
  save_validation_outputs: true

# Evaluation metrics to compute
metrics:
  - "mse"
  - "mae"
  - "sd_error"
  - "r2"
  - "pearson_r"
