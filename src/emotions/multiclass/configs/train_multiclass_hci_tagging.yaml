# Multiclass classification configuration for HCI-tagging experiments.

run_experiments:
  baselines: true
  gnn: true

multiclass_task:
  task_name: "emotion-id"  # emotion-id | va-quadrant
  target_column: "emotion-id"
  # target_columns: ["emotion-valence", "emotion-arousal"]
  # thresholds:
  #   valence: mean
  #   arousal: mean

# Dataset configuration shared by GNN and baselines.
dataset:
  data_filepath: "data/processed/cached_hci_tagging_emotion.csv"
  label_mapping_spec_path: "specifications/hci_to_GFM_spec.yaml"
  # filter_subjects: [P1, P8, P5, P4, P28, P2, P27]
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  min_samples_per_window: 3
  kt: 2
  ks: 2
  use_edge_weights: false
  tau: 0.05
  cache_dir: "data/cache"
  use_cache: false
  dropping_emotion_threshold: -1
  standardize_features: true
  target_aggregation: mean
  feature_columns: ["x-avg", "y-avg", "pupil-size-left-avg", "pupil-size-right-avg"]
  dropna_columns: [
    "time-rel-seconds",
    "x-avg",
    "y-avg",
    "pupil-size-left-avg",
    "pupil-size-right-avg",
    "emotion-id",
    "subject",
    "recording",
  ]
  experiment_type_column: "experiment-type"
  allowed_experiment_types: ["emotion-elicitation"]
  label_quality_column: "emotion-derivation-status"
  allowed_label_quality_values: ["ok"]

cross_validation:
  strategies:
    - subject_kfold
    # - recording_kfold
  n_splits: 5
  val_size: 1
  random_state: 42

baselines:
  models:
    - Mean
    - SVM
    - LightGBM
    - MLP
  hyperparameters:
    Mean: {}
    SVM:
      probability: true
      random_state: 42
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
      random_state: 42
    MLP:
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
      early_stopping: false

gnn:
  model:
    in_channels: 4
    hidden_channels: 128
    use_preprocess_mlp: true
    add_self_loops: true
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv
  training:
    num_epochs: 35
    batch_size: 64
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto
    random_seed: 42
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    use_torch_compile: true

metrics:
  - accuracy
  - balanced_accuracy
  - macro_precision
  - macro_recall
  - macro_f1
  - macro_auc_ovr
  - weighted_precision
  - weighted_recall
  - weighted_f1
  - weighted_auc_ovr

logging:
  results_dir: "results/multiclass"
  verbose: false
