# Configuration file for emotion prediction training

# Dataset configuration
dataset:
  # Path to processed data directory
  data_dir: "./data/processed/eSEEd_v2/"
  
  # File selection (null means load all files recursively)
  file_list: null
  
  # Whether to search recursively in subdirectories
  recursive: true
  
  # Directories to ignore during recursive search
  ignore_dirs: null
  
  # Graph construction parameters
  window_length: 10  # Window length in seconds
  window_overlap: 0.0  # Overlap fraction [0, 1)
  kt: 2  # Number of temporal neighbors
  ks: 2  # Number of spatial neighbors (kNN)
  
  # Caching configuration
  cache_dir: "./data/cache/"
  use_cache: true

# Model architecture configuration
model:
  # Input features: time, x, y, pupil-left, pupil-right
  in_channels: 5
  
  # Hidden layer dimensions
  hidden_channels: 64
  
  # Output dimensions (number of emotion labels)
  out_channels: 4
  
  # Output scaling factor for emotion scores
  output_scale: 10.0

# Training configuration
training:
  # Number of training epochs
  num_epochs: 10
  
  # Batch size for data loaders
  batch_size: 32
  
  # Learning rate
  learning_rate: 0.0001
  
  # Gradient clipping max norm
  grad_clip_max_norm: 1.0
  
  # Device selection (cuda, cpu, or auto)
  device: "auto"  # auto = cuda if available, else cpu
  
  # Random seed for reproducibility
  random_seed: 42

# Cross-validation configuration
cross_validation:
  # Strategies: List of strategies to run. Options: "subject_loo", "recording_loo", "combined_loo"
  # Can be a single string or a list of strings
  strategies:
    - "subject_loo"
    # - "recording_loo"
    # - "combined_loo"
  
  # Number of subjects/recordings for validation set
  val_size: 3
  
  # Random state for reproducible splits
  random_state: 42
  
  # Test split ratio (only used for simple_split strategy)
  test_size: 0.2

# Logging and checkpointing configuration
logging:
  # Base directory for results
  results_dir: "./results/SpatioTemporalHeteroGNN/eSEEd_v2/"
  
  # Print training progress every N epochs
  print_every: 10
  
  # Save validation outputs every N epochs (null = no saving)
  save_outputs_interval: null  # Will be computed as 10% of epochs
  
  # Whether to save model checkpoints
  save_best_model: true
  
  # Whether to save validation outputs during training
  save_validation_outputs: true

# Evaluation metrics to compute
metrics:
  - "mse"
  - "mae"
  - "sd_error"
  - "r2"
  - "pearson_r"
