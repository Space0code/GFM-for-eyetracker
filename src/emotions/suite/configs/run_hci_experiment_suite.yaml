# Wrapper config for running the full HCI experiment suite.

suite:
  # Suite-level metadata/comparison outputs and all experiment artifacts are stored under:
  # results/suite/<timestamp>/
  # Inside each suite run:
  # - experiments/<experiment_id_scope>/ contains snapshot + resolved config + EDA summary
  # - <experiment_id_scope>_<timestamp>/ contains trainer outputs
  results_dir: "results/suite"
  snapshot_cache_dir: "results/_snapshot_cache"
  seed: 42
  source_data_root: "data/processed/hci-tagging"
  base_configs:
    binary: "src/emotions/binary/configs/train_binary_hci_tagging.yaml"
    multiclass: "src/emotions/multiclass/configs/train_multiclass_hci_tagging.yaml"
    regression: "src/emotions/regression/configs/train_regression_hci_tagging.yaml"

global_overrides:
  cross_validation:
    strategies: 
      - "subject_kfold"
      # - "recording_kfold"
    n_splits: 5
    val_size: 1
    random_state: 42
  gnn:
    model:
      model_version: v2
      pooling: attention
      num_layers: 10
    training:
      early_stopping_enabled: true
      early_stopping_patience: 7
      early_stopping_min_delta: 0.0
      early_stopping_restore_best: true
  dataset:
    # If true, trainer graph-cache and suite snapshot-cache are both enabled.
    use_cache: true
    label_mapping_spec_path: "specifications/hci_to_GFM_spec.yaml"
    kt: 2
    ks: 2
    use_edge_weights: true
    graph_version: v2
    edge_weight_mode: learned_signed
    filter_subjects: null
    filter_recordings: null
    target_aggregation: mean
    signal_outlier_filter:
      enabled: true
      lower_quantile: 0.01
      upper_quantile: 0.99
      columns: [x-avg, y-avg, pupil-size-left-avg, pupil-size-right-avg]

experiments:
  binary_emotion_valence:
    enabled: true
    task_type: binary
    experiment_group: emotion
    scope: emotion-elicitation
    target_column: emotion-valence
    threshold: mean
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  binary_emotion_arousal:
    enabled: true
    task_type: binary
    experiment_group: emotion
    scope: emotion-elicitation
    target_column: emotion-arousal
    threshold: mean
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  binary_emotion_control:
    enabled: false
    task_type: binary
    experiment_group: emotion
    scope: emotion-elicitation
    target_column: emotion-control
    threshold: mean
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  binary_emotion_predictability:
    enabled: false
    task_type: binary
    experiment_group: emotion
    scope: emotion-elicitation
    target_column: emotion-predictability
    threshold: mean
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  binary_tag_agree:
    enabled: false
    task_type: binary
    experiment_group: tagging
    scopes: [image-tagging-1, image-tagging-2, video-tagging, pooled-tagging]
    target_column: tag-agree
    threshold: 0.5
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  binary_tag_valid:
    enabled: false
    task_type: binary
    experiment_group: tagging
    scopes: [image-tagging-1, image-tagging-2, video-tagging, pooled-tagging]
    target_column: tag-valid
    threshold: 0.5
    decision_threshold: 0.5
    overrides:
      metrics: [accuracy, balanced_accuracy, f1, precision, recall, auc]

  multiclass_emotion_id:
    enabled: false
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: emotion-id
    target_column: emotion-id

  multiclass_va_quadrant:
    enabled: false
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: va-quadrant
    target_columns: [emotion-valence, emotion-arousal]
    thresholds:
      valence: mean
      arousal: mean

  multiclass_table6_arousal_3class:
    enabled: false
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: table6-arousal-3class
    use_table6_3class_targets: true
    target_column: emotion-id
    drop_unmapped_labels: true
    class_name_mapping:
      0: Calm
      1: Medium arousal
      2: Excited/Activated
    table6_class_mapping:
      0: 0   # Neutral -> Calm
      1: 2   # Anger -> Excited
      2: 0   # Disgust -> Calm
      3: 2   # Fear -> Excited
      4: 1   # Joy/Happiness -> Medium
      5: 0   # Sadness -> Calm
      6: 2   # Surprise -> Excited
      11: 1  # Amusement -> Medium
      12: 2  # Anxiety -> Excited

  multiclass_table6_valence_3class:
    enabled: false
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: table6-valence-3class
    use_table6_3class_targets: true
    target_column: emotion-id
    drop_unmapped_labels: true
    class_name_mapping:
      0: Unpleasant
      1: Neutral valence
      2: Pleasant
    table6_class_mapping:
      0: 1   # Neutral -> Neutral
      1: 0   # Anger -> Unpleasant
      2: 0   # Disgust -> Unpleasant
      3: 0   # Fear -> Unpleasant
      4: 2   # Joy/Happiness -> Pleasant
      5: 0   # Sadness -> Unpleasant
      6: 1   # Surprise -> Neutral
      11: 2  # Amusement -> Pleasant
      12: 0  # Anxiety -> Unpleasant

  regression_emotion_valence:
    enabled: false
    task_type: regression
    experiment_group: regression
    scope: emotion-elicitation
    target_column: emotion-valence

  regression_emotion_arousal:
    enabled: false
    task_type: regression
    experiment_group: regression
    scope: emotion-elicitation
    target_column: emotion-arousal
