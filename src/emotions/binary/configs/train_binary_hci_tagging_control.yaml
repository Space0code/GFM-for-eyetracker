# Binary classification configuration for emotion recognition
# Based on train.yaml but adapted for binary classification task

# Control which experiments to run
run_experiments:
  baselines: true  # Run baseline classifiers
  gnn: true        # Run GNN classifier

# Binary classification task configuration
binary_task:
  target_column: "emotion-control"  # Preferred key (legacy: target_emotion)
  threshold: "mean"  # float or one of: median, mean (computed from train split only)
  decision_threshold: 0.5  # Probability threshold used at evaluation time
  embedding_projection_method: "pca"  # pca | tsne for TP/FP/TN/FN embedding plots

# Dataset configuration (shared by both GNN and baselines)
dataset:
  # Choose ONE of the following:
  # Option 1: Single CSV file (NEW - recommended)
  data_filepath: "data/processed/cached_hci_tagging_emotion.csv"
  filter_subjects: [P1, P8, P5, P4, P28, P2, P27] # Optional: list of subject IDs to include, e.g., [1, 2, 12, 21]
  # filter_recordings: [1, 2, 3] # Optional: list of recording IDs to include, e.g., [1, 2, 3]
  
  # Option 2: Directory with multiple CSV files (OLD - for backward compatibility)
  # data_dir: "data/processed/eSEEd_v2_processed"
  # file_list:  # Optional: specify which files to load from data_dir
  #   - sample_12_recording_01_merged.csv
  #   - sample_12_recording_02_merged.csv
  
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  min_samples_per_window: 3  # Align baseline windows with GNN minimum (max(kt, ks) + 1)
  kt: 2  # Temporal k-NN for GNN
  ks: 2  # Spatial k-NN for GNN
  use_edge_weights: true  # Whether to use edge weights in GNN layers (requires conv_type that supports it)
  graph_version: v2
  tau: 0.05 # Time decay constant for edge weights (in seconds)
  cache_dir: "data/cache"
  use_cache: false
  dropping_emotion_threshold: -1  # Drop samples where all emotions <= this value (-1 to disable)
  standardize_features: true  # StandardScaler fitted on train split only
  target_aggregation: mean  # Use the same aggregation for GNN and baselines
  feature_columns: ["x-avg", "y-avg", "pupil-size-left-avg", "pupil-size-right-avg"]
  dropna_columns: ["time-rel-seconds", "x-avg", "y-avg", "pupil-size-left-avg", "pupil-size-right-avg", "emotion-control", "subject", "recording"]
  experiment_type_column: "experiment-type"
  allowed_experiment_types: ["emotion-elicitation"]
  label_quality_column: "emotion-derivation-status"
  allowed_label_quality_values: ["ok"]

# Cross-validation configuration (shared)
cross_validation:
  strategies: 
    - subject_kfold
    # - recording_kfold
  val_size: 1  # Number of subjects/recordings/pairs for validation
  n_splits: 5
  random_state: 42

# Baseline models configuration
baselines:
  # List of baseline classifiers to train
  models:
    - Mean
    - SVM
    - LightGBM
    - MLP
  
  # Hyperparameters for each model
  hyperparameters:
    Mean: {}
    SVM:
      n_jobs: -1
      probability: true  # Enable probability estimates
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
    MLP:
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
      early_stopping: false

# GNN model configuration
gnn:
  model:
    model_version: v2
    in_channels: 4  # 4 node features: (time dropped), x, y, pupil-left, pupil-right
    hidden_channels: 128
    use_preprocess_mlp: true
    add_self_loops: true
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv # GCNConv, GATConv. GATConv does not support edge weights!
  
  training:
    num_epochs: 35
    batch_size: 64
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto  # 'auto', 'cuda', or 'cpu'
    random_seed: 42
    
    # DataLoader optimization (Plan A - Quick Wins)
    num_workers: 8  # Parallel data loading (increase to 8 for larger datasets) (doesn't help much in current case)
    pin_memory: true  # Faster CPU->GPU transfer (actually helps a bit)
    persistent_workers: true  # Avoid respawning workers (actually helps a bit)
    use_torch_compile: true  # JIT compilation (10-30% speedup, PyTorch 2.0+) (actually helps quite a bit)

# Binary classification metrics
metrics:
  - accuracy
  - precision
  - recall
  - f1
  - auc

# Logging configuration
logging:
  results_dir: "results/binary"
  save_outputs_interval: 10  # Save outputs every N epochs for GNN
  verbose: false
