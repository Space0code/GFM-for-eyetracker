  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  kt: 5  # Temporal k-NN for GNN
  ks: 5  # Spatial k-NN for GNN
  cache_dir: "data/cache"
  use_cache: true
  dropping_emotion_threshold: -1  # Drop samples where all emotions <= this value (-1 to disable)

# Cross-validation configuration (shared)
cross_validation:
  strategies: 
    - subject_loo
    - recording_loo
    # - combined_loo
  val_size: 1  # Number of subjects/recordings/pairs for validation
  random_state: 42

# Baseline models configuration
baselines:
  # List of baseline classifiers to train
  models:
    - Mean
    - SVM
    - LightGBM
    - MLP
  
  # Hyperparameters for each model
  hyperparameters:
    Mean: {}
    SVM:
      n_jobs: -1
      probability: true  # Enable probability estimates
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
    MLP:
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
      early_stopping: false

# GNN model configuration
gnn:
  model:
    in_channels: 5  # 5 node features: time, x, y, pupil-left, pupil-right
    hidden_channels: 64
    use_preprocess_mlp: true
    add_self_loops: false
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    conv_type: GCNConv
  
  training:
    num_epochs: 12
    batch_size: 32
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto  # 'auto', 'cuda', or 'cpu'
    random_seed: 42

# Binary classification metrics
metrics:
  - accuracy
  - precision
  - recall
  - f1
  - auc

# Logging configuration
logging:
  results_dir: "results/binary"
  save_outputs_interval: 10  # Save outputs every N epochs for GNN
