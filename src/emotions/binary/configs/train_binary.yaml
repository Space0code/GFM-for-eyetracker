# Binary classification configuration for emotion recognition
# Based on train.yaml but adapted for binary classification task

# Control which experiments to run
run_experiments:
  baselines: true  # Run baseline classifiers
  gnn: true        # Run GNN classifier

# Binary classification task configuration
binary_task:
  target_emotion: "emotion-anger"  # Which emotion to predict (choose one)
  threshold: 0.0  # Intensity threshold: <=threshold -> class 0, >threshold -> class 1

