# Wrapper config focused on Table-6 three-class multiclass experiments for quick v1/v2 comparison.
#
# Usage:
#   python src/emotions/gnn_improvement_experiments/run_quick_v1_v2_comparison.py \
#       --base-config src/emotions/gnn_improvement_experiments/configs/quick_v1_v2/run_hci_experiment_suite_table6_3class.yaml

suite:
  results_dir: "results/suite"
  snapshot_cache_dir: "results/_snapshot_cache"
  seed: 42
  source_data_root: "data/processed/hci-tagging"
  base_configs:
    binary: "src/emotions/gnn_improvement_experiments/configs/quick_v1_v2/quick_v1_v2_train_binary_hci_tagging.yaml"
    multiclass: "src/emotions/gnn_improvement_experiments/configs/quick_v1_v2/quick_v1_v2_train_multiclass_hci_tagging.yaml"

quick_comparison:
  # Diploma main comparison models. Keep old internal graph variants out of the
  # default thesis run; use --models only for ad hoc research comparisons.
  models: [Random, Majority, LightGBM, SVM, MLP, GazeMAE_MLP, BasicGCN_mean, BasicGCN_attention, GNN_v2]
  # Select one or both Table-6 tasks for the v1/v2 quick runner:
  #   table6_tasks: [arousal]
  table6_tasks: [valence, arousal]
  #   table6_tasks: [arousal, valence]

global_overrides:
  benchmarking:
    enabled: true
    warmup_runs: 1
    timed_runs: 3
    synthetic_windows_per_run: 16
  cross_validation:
    strategies:
      # - "subject_kfold"
      # - "recording_kfold"
      - subject_loo
      - recording_loo
    n_splits: 5
    val_size: 2
    random_state: 42
  gnn:
    model:
      # Shared convolution for fair GNN_v1/GNN_v2 comparisons.
      # Change only conv_type to compare both variants with GCN vs GAT:
      #   conv_type: GCNConv
      #   conv_type: GATConv
      # GATConv ignores scalar edge weights in the model code, while GCNConv
      # consumes them when dataset.use_edge_weights is true.
      conv_type: GCNConv
      model_version: v2
      head_pooling: attention
      graph_pooling: attention
      relation_pooling: mlp
      # Backward-compatible v1 pooling key. V1 supports mean/mean_max only.
      # V2 uses graph_pooling/head_pooling above, so this does not disable
      # attention graph pooling for GNN_v2.
      pooling: mean_max
      num_layers: 2
      hidden_channels: 64
    training:
      early_stopping_enabled: true
      early_stopping_patience: 20
      early_stopping_min_delta: 0.0
      early_stopping_restore_best: true
      learning_rate: 0.00005
      num_epochs: 500
      batch_size: 256
      num_workers: 4
  dataset:
    use_cache: true
    label_mapping_spec_path: "specifications/hci_to_GFM_spec.yaml"
    kt: 1
    ks: 1
    use_edge_weights: true
    graph_version: v2
    edge_weight_mode: learned_signed
    use_relative_time: true
    use_distance_avg: true
    use_fixation_duration: true
    use_delta_distance_edge_feature: true
    use_fixation_edges: true
    fixation_dilation_k: 3
    standardize_edge_features: true
    # Set these to lists for quick subset runs, e.g. [P1, P8, P5] and [69.avi, 55.avi].
    filter_subjects: null
    exclude_subjects: [P9, P12, P15]
    filter_recordings: null
    min_samples_per_window: 60
    target_aggregation: mean
    signal_outlier_filter:
      enabled: true
      lower_quantile: 0.01
      upper_quantile: 0.99
      columns: [x-avg, y-avg, pupil-size-left-avg, pupil-size-right-avg]

experiments:
  multiclass_table6_arousal_3class:
    enabled: true
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: table6-arousal-3class
    use_table6_3class_targets: true
    target_column: emotion-id
    drop_unmapped_labels: true
    class_name_mapping:
      0: Calm
      1: Medium aroused
      2: Excited/Activated
    table6_class_mapping:
      0: 0
      1: 2
      2: 0
      3: 2
      4: 1
      5: 0
      6: 2
      11: 1
      12: 2

  multiclass_table6_valence_3class:
    enabled: true
    task_type: multiclass
    experiment_group: multiclass
    scope: emotion-elicitation
    task_name: table6-valence-3class
    use_table6_3class_targets: true
    target_column: emotion-id
    drop_unmapped_labels: true
    class_name_mapping:
      0: Unpleasant
      1: Neutral valence
      2: Pleasant
    table6_class_mapping:
      0: 1
      1: 0
      2: 0
      3: 0
      4: 2
      5: 0
      6: 1
      11: 2
      12: 0
