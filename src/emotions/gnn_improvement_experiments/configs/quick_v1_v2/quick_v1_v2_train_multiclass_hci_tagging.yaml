# Multiclass trainer base for quick v1/v2 experiments on MAHNOB-HCI-TAGGING.
#
# "hci_tagging" in this filename refers to the source dataset name, not to
# implicit/image/video tagging tasks. The quick Table-6 wrapper uses this base
# with scope: emotion-elicitation and overrides the concrete task to arousal or
# valence as selected by quick_comparison.table6_tasks in the wrapper YAML. The
# arousal task below is only the standalone fallback for this trainer config.

run_experiments:
  baselines: true
  gnn: true

multiclass_task:
  task_name: "table6-arousal-3class"
  target_column: "emotion-id"
  use_table6_3class_targets: true
  drop_unmapped_labels: true
  class_name_mapping:
    0: Calm
    1: Medium aroused
    2: Excited/Activated
  table6_class_mapping:
    0: 0
    1: 2
    2: 0
    3: 2
    4: 1
    5: 0
    6: 2
    11: 1
    12: 2

# Dataset configuration shared by GNN and baselines.
dataset:
  data_filepath: "data/processed/cached_hci_tagging_emotion.csv"
  label_mapping_spec_path: "specifications/hci_to_GFM_spec.yaml"
  # Conservative default: exclude paper-flagged problematic participants.
  # P15 is already absent from the local ET copy, but we keep it listed for clarity.
  exclude_subjects: [P9, P12, P15]
  # filter_subjects: [P1, P8, P5, P4, P28, P2, P27]
  recursive: true
  ignore_dirs: []
  window_length: 10
  window_overlap: 0
  min_samples_per_window: 60
  kt: 2
  ks: 2
  use_edge_weights: true
  graph_version: v2
  edge_weight_mode: learned_signed
  use_relative_time: true
  use_distance_avg: true
  use_fixation_duration: true
  use_delta_distance_edge_feature: true
  use_fixation_edges: true
  tau: 0.05
  cache_dir: "data/cache"
  use_cache: false
  dropping_emotion_threshold: -1
  standardize_features: true
  standardize_edge_features: true
  target_aggregation: mean
  feature_columns: ["x-avg", "y-avg", "pupil-size-left-avg", "pupil-size-right-avg"]
  dropna_columns: [
    "time-rel-seconds",
    "x-avg",
    "y-avg",
    "pupil-size-left-avg",
    "pupil-size-right-avg",
    "emotion-id",
    "subject",
    "recording",
  ]
  experiment_type_column: "experiment-type"
  allowed_experiment_types: ["emotion-elicitation"]
  label_quality_column: "emotion-derivation-status"
  allowed_label_quality_values: ["ok"]

cross_validation:
  strategies:
    - subject_kfold
    # - recording_kfold
  n_splits: 5
  val_size: 1
  random_state: 42

baselines:
  models:
    - Mean
    - SVM
    - LightGBM
    - MLP
  hyperparameters:
    Mean: {}
    SVM:
      probability: true
      random_state: 42
    LightGBM:
      n_estimators: 100
      n_jobs: -1
      verbose: -1
      random_state: 42
    MLP:
      hidden_layer_size: 64
      max_iter: 200
      random_state: 42
      early_stopping: false
    GazeMAE_MLP:
      hidden_layer_size: 128
      num_epochs: 100
      learning_rate: 0.001
      weight_decay: 0.0001
      dropout: 0.2
      early_stopping_patience: 15
      batch_size: 128
      random_state: 42
      device: auto

gazemae:
  repo_root: "/home/ppg/eyetracking/gazemae"
  model_pos: "/home/ppg/eyetracking/gazemae/models/pos-i3738"
  model_vel: "/home/ppg/eyetracking/gazemae/models/vel-i8528"
  screen_width: 1280
  screen_height: 800
  clip_to_screen: true
  target_hz: 500
  chunk_seconds: 2.0
  chunk_pooling: mean_std
  batch_size: 256
  device: auto
  cache_embeddings: true

gnn:
  model:
    model_version: v2
    in_channels: 4
    hidden_channels: 128
    head_pooling: attention
    graph_pooling: attention
    relation_pooling: mlp
    use_preprocess_mlp: true
    add_self_loops: true
    dropout_mlp: 0.1
    dropout_gnn: 0.1
    dropout_head: 0.1
    aggr: mean
    # Trainer fallback. The quick v1/v2 wrapper overrides this so GNN_v1 and
    # GNN_v2 share the same convolution in comparison runs.
    conv_type: GCNConv
  training:
    num_epochs: 35
    batch_size: 64
    learning_rate: 0.001
    grad_clip_max_norm: 1.0
    device: auto
    random_seed: 42
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    use_torch_compile: true

metrics:
  - accuracy
  - balanced_accuracy
  - macro_precision
  - macro_recall
  - macro_f1
  - macro_auc_ovr
  - weighted_precision
  - weighted_recall
  - weighted_f1
  - weighted_auc_ovr

logging:
  results_dir: "results/multiclass"
  verbose: false
